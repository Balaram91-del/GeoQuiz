<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- css file linking -->
    <link rel="stylesheet" href="styles.css" />

    <!-- icons link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- font links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=KoHo:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>GeoQuiz</title>
  </head>
  <body>
    <nav>
      <div class="logo">
        <a>Geo<span>Quiz</span></a>
      </div>
      <menu>
        <a href="#">HOME</a>
        <a href="#">QUIZES</a>
        <a href="#">DAILY TRIVIA</a>
        <a href="#">CONTACT ME</a>
      </menu>
      <div class="side-menu">
        <button class="theme-btn" id="theme-btn">
          <i id="theme-icon" class="ri-sun-fill"></i>
        </button>
        <button class="hamburger-menu">
          <i class="ri-menu-fold-line"></i>
        </button>
      </div>
    </nav>
    <main>
      <section class="hero-section">
        <div class="hero-content">
          <div class="banner">
            <img
              width="50"
              height="50"
              src="https://img.icons8.com/bubbles/50/earth-planet.png"
              alt="earth-planet"
            />
            <p>Explore</p>
            <p class="middle-dot">&middot;</p>
            <p>Learn</p>
            <p class="middle-dot">&middot;</p>
            <p>Play</p>
          </div>
          <h1>Do you know your facts about <span>Geography ?</span></h1>
          <p class="sub-heading">Let's check your knowledge with fun and engagin quizzes from around the <span>world.</span></p>
          <a href="" class="primary-btn hero-btn">Start Now <i class="ri-arrow-right-fill"></i></a>
        </div>
        <div class="hero-image">
          <img src="./assets/vecteezy_3d-map-with-sandals-luggage-boy-propeller-plane-measure_43195519.png" alt="">
        </div>
      </section>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
